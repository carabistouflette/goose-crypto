name: Artifact example
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build python3 python3-cryptography pkg-config libsodium-dev libcurl4-openssl-dev libarchive-dev zlib1g-dev clang
      - run: make setup
      - run: make artifact-test
      - run: make artifact-sanitize SANITIZER_CC=gcc
      - run: make artifact-sanitize SANITIZER_CC=clang
